[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mjlab-hf_zoo"
version = "0.1.0"
description = "LeRobot/Pollen legged robot models + MJLab training examples (no pretrained policies)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mjlab",
  # Pin to match mjlab_microduck: rsl-rl 5.x removed the `policy` runner-cfg
  # key (split into actor/critic) so mjlab d1d32d8's config no longer works
  # with it. 3.3.0 is what microduck's lock uses.
  "rsl-rl-lib==3.3.0",
]

[project.optional-dependencies]
visualization = ["rerun-sdk>=0.20.0"]
dev = [
  "rerun-sdk>=0.20.0",
  "ruff>=0.7.0",
  "pytest>=8.0.0",
]

# MJLab will import this module; that import must trigger register_mjlab_task(...)
[project.entry-points."mjlab.tasks"]
mjlab_hf_zoo = "training_exemples"

[tool.hatch.metadata]
allow-direct-references = true

# IMPORTANT: package the top-level package(s) you want importable
[tool.hatch.build.targets.wheel]
packages = ["training_exemples"]

# Include your robot assets
[tool.hatch.build]
include = [
  "training_exemples/**",
  "models/**",
  "README.md",
  "pyproject.toml",
]

[tool.ruff]
src = ["training_exemples"]
indent-width = 4
line-length = 100

[tool.uv]
override-dependencies = ["mujoco"]

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab.git", rev = "d1d32d8b86e68fe317356de2561f4efc63ffcc29" }
